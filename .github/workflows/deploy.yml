name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Tags error reports with the deployed commit.
      VITE_RELEASE: ${{ github.sha }}
      # Enables hidden source maps + upload. If the secret isn't set, the site
      # still deploys; Sentry stack traces just stay minified.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: rakicodes
      SENTRY_PROJECT: color-mixer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Core unit tests + web component tests.
      - run: npm test
      # End-to-end tests in Chromium. Retries (playwright.config.ts) absorb rare
      # flakiness; a real failure still blocks the deploy.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
      - run: npm run build
      # Inject debug IDs into the built files themselves, then upload those
      # exact files, so what Sentry has matches what is deployed.
      - name: Upload source maps to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          npx sentry-cli sourcemaps inject web/dist
          npx sentry-cli sourcemaps upload --release "$VITE_RELEASE" web/dist
      - name: Remove source maps from the published site
        run: find web/dist -name '*.map' -print -delete
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
