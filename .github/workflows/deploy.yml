name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Tags error reports with the deployed commit.
      VITE_RELEASE: ${{ github.sha }}
      # Enables hidden source maps + upload. If the secret isn't set, the site
      # still deploys; Sentry stack traces just stay minified.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: rakicodes
      SENTRY_PROJECT: color-mixer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Inject debug IDs into the built files themselves, then upload those
      # exact files, so what Sentry has matches what is deployed.
      - name: Upload source maps to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          npx sentry-cli sourcemaps inject web/dist
          npx sentry-cli sourcemaps upload --release "$VITE_RELEASE" web/dist
      - name: Remove source maps from the published site
        run: find web/dist -name '*.map' -print -delete
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
