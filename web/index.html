<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf5ee" />
    <title>Color Mixer</title>
    <script>
      // Apply the saved theme before first paint, so dark mode doesn't flash light.
      // Keep in sync with src/theme.ts.
      try {
        var theme = JSON.parse(localStorage.getItem('color-mixer:settings') || '{}').theme;
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <!-- Linked here (not imported from JS) so it blocks first paint; avoids a flash of unstyled content in dev. -->
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-row">
        <h1>Color Mixer</h1>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Theme">◐</button>
      </div>
    </header>
    <main id="view"></main>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <button data-tab="paints">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="6" width="18" height="12" rx="3" />
          <circle cx="8.5" cy="12" r="2.2" />
          <circle cx="15.5" cy="12" r="2.2" />
        </svg>
        Paints
      </button>
      <button data-tab="target">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3.5c3 3.6 6 7 6 10.5a6 6 0 0 1-12 0c0-3.5 3-6.9 6-10.5Z" />
        </svg>
        Target
      </button>
      <button data-tab="mix">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10A.5.5 0 0 1 7 20Z" transform="translate(-0.5 0)" />
          <path d="M9.5 11h5M9.5 14h5M9.5 17h3" />
        </svg>
        Mix
      </button>
    </nav>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
