<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4ef" />
    <title>Watercolor Mixer</title>
    <script>
      // Apply the saved theme before first paint, so dark mode doesn't flash light.
      // Keep in sync with src/theme.ts.
      try {
        var theme = JSON.parse(localStorage.getItem('color-mixer:settings') || '{}').theme;
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <!-- Linked here (not imported from JS) so it blocks first paint; avoids a flash of unstyled content in dev. -->
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-row">
        <h1>Watercolor Mixer</h1>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Theme">◐</button>
      </div>
      <nav class="tabs" id="tabs">
        <button data-tab="paints">Paints</button>
        <button data-tab="target">Target</button>
        <button data-tab="mix">Mix</button>
      </nav>
    </header>
    <main id="view"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
